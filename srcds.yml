---
- name: Build srcds instances
  hosts: tf2
  strategy: free
  pre_tasks:
    - name: Stop existing srcds instances
      become: true
      ansible.builtin.systemd:
        name: "srcds-{{ item.server_name_short }}"
        state: stopped
      loop: "{{ services }}"
      # unit does not exist on fresh hosts
      ignore_errors: true  # noqa ignore-errors
      tags:
        - never
        - clean

    - name: Clean existing sourcemod build directory
      ansible.builtin.file:
        path: ~/build_sourcemod/
        state: absent
      tags:
        - never
        - clean

    - name: Unmount existing game instances
      become: true
      ansible.builtin.command:
        cmd: umount /home/tf2server/srcds-{{ item.server_name_short }}
      loop: "{{ services }}"
      failed_when: false
      changed_when: false
      tags:
        - never
        - clean

    - name: Clean existing deployed game instance
      ansible.builtin.command:
        cmd: >-
          rm -rf
          /home/tf2server/srcds-{{ item.server_name_short }}
          /home/tf2server/srcds-{{ item.server_name_short }}-upper
          /home/tf2server/srcds-{{ item.server_name_short }}-work
      loop: "{{ services }}"
      changed_when: true
      tags:
        - never
        - clean

  roles:
    - srcds
