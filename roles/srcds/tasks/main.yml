  changed_when: true
  register: srcds_changed

- name: "Collect names of services with changed configs"
  ansible.builtin.set_fact:
    # Append service name to a list if its config was modified
    srcds_services: "{{ srcds_services | default([]) + [item.server_name_short] }}"
  loop: "{{ services }}"
  loop_control:
    index_var: loop0
  tags:
    - game_engine

- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  tags:
    - game_engine

- name: "Trigger srcds reload"
  ansible.builtin.debug:
    msg: "Reloading srcds services: {{ srcds_services | join(', ') }}"
  notify: "Restart SRCDS"
  when: srcds_services is defined and srcds_services | length > 0
  tags:
    - game_engine

- name: Cron srcds
  become: true
  ansible.builtin.cron:
    name: "tf2-restart-{{ item.server_name_short }}"
    weekday: "*"
    minute: "0"
    hour: "6"
    job: "systemctl restart srcds-{{ item.server_name_short }}"
  loop: "{{ services }}"
  loop_control:
    index_var: loop0
  tags: cron

- name: Remove legacy srcds logrotate config
  become: true
  ansible.builtin.file:
    path: /etc/logrotate.d/srcds-{{ item.server_name_short }}
    state: absent
  loop: "{{ services }}"
  loop_control:
    index_var: loop0
  tags: cron

- name: Purge legacy rotated srcds logs
  become: true
  ansible.builtin.command:
    cmd: "find /home/{{ srcds_user }}/srcds-{{ item.server_name_short }}/tf/logs -type f -name '*.log.*' -delete"
  loop: "{{ services }}"
  loop_control:
    index_var: loop0
  changed_when: false
  failed_when: false
  tags: cron

- name: Cron clean-logs
  become: true
  ansible.builtin.cron:
    name: "srcds-clean-logs-{{ item.server_name_short }}"
    weekday: "*"
    minute: "0"
    hour: "5"
    month: "*"
    job: "find /home/{{ srcds_user }}/srcds-{{ item.server_name_short }}/tf/logs -type f \\( -mtime +7 -name '*.log*' \\) -delete"
  loop: "{{ services }}"
  loop_control:
    index_var: loop0
  tags: cron

- name: Cron clean-stv
  become: true
  ansible.builtin.cron:
    name: "srcds-clean-stv-{{ item.server_name_short }}"
    weekday: "*"
    minute: "0"
    hour: "*"
    month: "*"
    job: "find /home/{{ srcds_user }}/srcds-{{ item.server_name_short }}/tf/stv_demos/complete -type f -mtime +12 -delete"
  loop: "{{ services }}"
  loop_control:
    index_var: loop0
  when: ansible_facts["distribution"] == 'Ubuntu'
  tags: cron
