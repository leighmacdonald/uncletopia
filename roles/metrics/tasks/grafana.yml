---
- name: Generate /etc/grafana.ini
  become: true
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana.ini
    mode: "0770"
  tags:
    - grafana

- name: Create a directory if it does not exist
  become: true
  ansible.builtin.file:
    path: /etc/grafana/provisioning/datasources/
    state: directory
    mode: "0777"
  tags:
    - grafana

- name: Create a directory if it does not exist
  become: true
  ansible.builtin.file:
    path: /etc/grafana/provisioning/dashboards/
    state: directory
    mode: "0777"
  tags:
    - grafana

- name: Create alerting provisioning directory
  become: true
  ansible.builtin.file:
    path: /etc/grafana/provisioning/alerting/
    state: directory
    mode: "0777"
  tags:
    - grafana

- name: Generate /etc/grafana_datasources.yml
  become: true
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: /etc/grafana_datasources.yml
    mode: "0770"
  tags:
    - grafana

- name: Generate /etc/grafana_dashboards.yml
  become: true
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: /etc/grafana_dashboards.yml
    mode: "0770"
  tags:
    - grafana

- name: Generate /etc/grafana_alerts.yml
  become: true
  ansible.builtin.template:
    src: grafana-alerts.yml.j2
    dest: /etc/grafana_alerts.yml
    mode: "0770"
  tags:
    - grafana

- name: Copy dashboard sources
  become: true
  ansible.builtin.copy:
    src: "{{ role_path }}/files/"
    dest: /etc/grafana_dashboards
    mode: "0755"
  tags:
    - grafana

- name: Remove dashboard sources that are no longer provisioned
  become: true
  ansible.builtin.file:
    path: "/etc/grafana_dashboards/dashboards/{{ item }}"
    state: absent
  loop: "{{ metrics_grafana_removed_dashboards }}"
  tags:
    - grafana

- name: Create grafana_data volume
  community.docker.docker_volume:
    name: grafana_data
    state: present
  tags:
    - grafana

# Older Grafana schemas left unique guid indexes that 10.4 cannot satisfy.
- name: Get grafana_data volume mountpoint
  community.docker.docker_volume_info:
    name: grafana_data
  register: metrics_grafana_volume_info
  tags:
    - grafana
    - grafana-db-fix

- name: Drop stale Grafana alert rule indexes
  ansible.builtin.script:
    cmd: "{{ role_path }}/scripts/fix_alert_indexes.py {{ metrics_grafana_volume_info.volume.Mountpoint }}/grafana.db"
    executable: python3
  become: true
  register: metrics_grafana_index_fix
  changed_when: metrics_grafana_index_fix.stdout | trim == 'changed'
  tags:
    - grafana
    - grafana-db-fix

# Grafana 13 migrates folders/dashboards to unified storage on first start.
# Keep a one-time pre-upgrade copy of the SQLite database for rollback.
- name: Back up Grafana database before the 13.x migration
  become: true
  ansible.builtin.copy:
    src: "{{ metrics_grafana_volume_info.volume.Mountpoint }}/grafana.db"
    dest: "{{ metrics_grafana_volume_info.volume.Mountpoint }}/grafana.db.pre13-backup"
    remote_src: true
    mode: "0600"
    force: false
  tags:
    - grafana
    - grafana-db-fix

- name: Create grafana_image_renderer container
  community.docker.docker_container:
    name: grafana_image_renderer
    image: grafana/grafana-image-renderer:v5.12.11
    restart: true
    recreate: true
    restart_policy: unless-stopped
    networks:
      - name: caddy_net
    pull: true
    env:
      AUTH_TOKEN: "{{ metrics_grafana_renderer_token }}"
    ports:
      - 127.0.0.1:8081:8081
  tags:
    - grafana

- name: Create grafana container
  community.docker.docker_container:
    name: grafana
    # grafana-oss image was retired after 13.0; grafana/grafana is the OSS build.
    image: grafana/grafana:13.3.1-ubuntu
    restart: true
    recreate: true
    restart_policy: unless-stopped
    comparisons:
      networks: strict
    networks:
      - name: caddy_net
    pull: true
    volumes:
      - /etc/grafana.ini:/etc/grafana/grafana.ini
      - /etc/grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - /etc/grafana_dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - /etc/grafana_alerts.yml:/etc/grafana/provisioning/alerting/alerts.yml
      - /etc/grafana_dashboards:/etc/grafana_dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:{{ grafana.port | default(3000) }}:3000"
  tags:
    - grafana

- name: Generate /grafana.conf
  ansible.builtin.template:
    src: grafana.conf.j2
    dest: grafana.conf
    mode: "0770"

- name: Copy caddy config
  community.docker.docker_container_copy_into:
    container: caddy
    path: grafana.conf
    container_path: /etc/caddy/conf.d/grafana.conf
  notify:
    - restart caddy
