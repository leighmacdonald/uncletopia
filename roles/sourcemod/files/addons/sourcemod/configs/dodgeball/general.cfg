// TF2 Dodgeball - general config
// Full field reference + recipes: see guide.md in this folder.

"tf2_dodgeball"
{
    "general"
    {
        "max velocity"                   "3500.0"  // float; engine cap override for sv_maxvelocity. 0 = leave TF2 default (3500.0). Source displays as N.000000 in console — same value, different formatting.
        "push prevention"                "1"       // airblasts don't push other players
        "push prevention toggle"         "0"       // players can toggle with !ab
        "noblock"                        "1"       // no player-to-player collision
        "target lock"                    "0"       // prevent rocket target-switching on deflect
        "target lock bot only"           "0"       // only for bots
        "music"                          "0"       // gamemode music (see guide.md)

        // Experimental scaling modes (all dormant by default — see guide.md "Advanced")
        "orbit coefficient"              "0"
        "target speed scaling"           "0"
        "smooth elevation"               "0"

        // Music paths (only used if music = 1)
        "round start"                    ""
        "round end (win)"                ""
        "round end (lose)"               ""
        "gameplay"                       ""
        "use web player"                 "0"
        "web player url"                 ""
    }

    // "steering control" / "bounce control" are seconds. See guide.md for feel ranges.
    "classes"
    {
        "common"
        {
            "name"                       "Homing Rocket"
            "behaviour"                  "homing"       // "homing" | "legacy homing"

            // --- Movement ---
            "speed"                      "950"
            "speed increment"            "250"
            "speed limit"                "0"            // 0 = no cap
            "turn rate"                  "0.28"
            "turn rate increment"        "0.022"
            "turn rate limit"            "0"

            // --- Damage ---
            "damage"                     "40"
            "damage increment"           "25"
            "critical chance"            "100"
            "crit glow stack"            "2"            // stack N fake-crit particles for denser glow (1-10). 1 = default.
            // Per-team crit glow particle override. Empty/missing = engine default.
            // Particle name MUST exist in ParticleEffectNames or it renders nothing.
            // "crit glow particle red"     ""             // default: "critical_rocket_red"
            // "crit glow particle blue"    ""             // default: "critical_rocket_blue"
            // "crit glow particle neutral" ""             // default: "eyeboss_projectile"

            // --- Drag / bounce feel (per-class design knobs, seconds) ---
            "steering control"           "0.074"        // pre-read drag window
            "bounce control"             "0.074"        // post-bounce blind window
            "control delay"              "0"            // extra blind seconds after eye-read
            "max bounces"                "10000"
            "bounce ceiling"             "0"            // max bounce arc height (HU). 0 = no clamp. Try 300-500 for high-deflect rockets.
            "think interval"             "0"            // 0 = per-tick smooth (default). 0.05 = 20Hz Damizean.

            // --- Targeting behavior ---
            "keep direction"             "1"
            "reset bounces"              "1"
            "neutral rocket"             "0"
            "teamless deflects"          "0"
            "can be stolen"              "0"
            "steal team check"           "1"
            "direction to target weight" "100"

            // --- Elevation (if enabled) ---
            "elevate on deflect"         "0"
            "elevation rate"             "0"
            "elevation limit"            "0"

            // --- Progression modifiers ---
            "no. players modifier"       "0"
            "no. rockets modifier"       "0"

            // --- Visual ---
            "model"                      ""             // empty = default rocket
            "is animated"                "0"

            // --- Sounds ---
            "play spawn sound"           "1"
            "play beep sound"            "1"
            "play alert sound"           "1"
            "spawn sound"                ""
            "beep sound"                 ""
            "alert sound"                ""
            "beep interval"              "0"

            // --- Events ---
            // "on kill" fires only on deflected kills (@deflections > 0).
            // "on spawn kill" fires only on undeflected kills (@deflections == 0).
            // They are mutually exclusive — exactly one fires per kill.
            "on spawn"                   ""
            "on deflect"                 ""
            "on kill"                    "tf_dodgeball_print [{olive}TFDB{default}] {yellow}★ KILL{default} | {lightblue}##@owner## {default}killed {red}##@dead## {default}| Deflects: {darkorange}@deflections {default}| Speed: {red}@capmphspeed mph"
            "on spawn kill"              "tf_dodgeball_print [{olive}TFDB{default}] {yellow}★ KILL{default} | {red}##@dead## {default}died to a spawn rocket"
            "on explode"                 ""
            "on no target"               ""
            "on destroyed"               ""
        }

        "nuke"
        {
            "name"                       "Nuke!"
            "behaviour"                  "homing"

            "speed"                      "550"
            "speed increment"            "100"
            "speed limit"                "0"
            "turn rate"                  "0.233"
            "turn rate increment"        "0.0275"
            "turn rate limit"            "0"

            "damage"                     "200"
            "damage increment"           "200"
            "critical chance"            "0"

            "steering control"           "0.045"
            "bounce control"             "0.045"
            "control delay"              "0"
            "max bounces"                "0"            // explodes on first contact

            "keep direction"             "1"
            "reset bounces"              "0"
            "can be stolen"              "1"
            "steal team check"           "0"
            "direction to target weight" "25"

            "elevate on deflect"         "0"
            "elevation rate"             "0.1237"
            "elevation limit"            "0.1237"

            "model"                      "models/custom/dodgeball/nuke/nuke.mdl"
            "is animated"                "1"

            "play spawn sound"           "1"
            "play beep sound"            "1"
            "play alert sound"           "1"
            "beep interval"              "0.2"

            "on kill"                    "tf_dodgeball_print [{olive}TFDB{default}] {darkmagenta}☢ NUKE{default} | {lightblue}##@owner## {default}nuked {red}##@dead## {default}| Deflects: {darkorange}@deflections {default}| Speed: {red}@capmphspeed mph"
            "on spawn kill"              "tf_dodgeball_print [{olive}TFDB{default}] {darkmagenta}☢ NUKE{default} | {red}##@dead## {default}got nuked by a spawn rocket"
            "on explode"                 "tf_dodgeball_explosion @dead ; tf_dodgeball_shockwave @dead 200 1000 1000 600"
        }

        // Authentic YADB 20Hz feel. Dormant by default (spawn chance 0).
        // See guide.md "Recipes" → "Damizean-authentic — Legacy".
        "damizean legacy"
        {
            "name"                       "Damizean Legacy"
            "behaviour"                  "homing"

            "speed"                      "1100"
            "speed increment"            "70"
            "speed limit"                "0"
            "turn rate"                  "0.233"
            "turn rate increment"        "0.0275"
            "turn rate limit"            "0"

            "damage"                     "100"
            "damage increment"           "50"
            "critical chance"            "10"

            "steering control"           "0.045"
            "bounce control"             "0.045"
            "control delay"              "0"
            "max bounces"                "10000"
            "think interval"             "0.05"         // 20Hz homing — Damizean's native rate

            "keep direction"             "0"
            "can be stolen"              "1"
            "direction to target weight" "100"

            "play spawn sound"           "1"
            "play beep sound"            "1"
            "play alert sound"           "1"
            "beep interval"              "0.3"
        }
    }

    "spawners"
    {
        "red"
        {
            "max rockets"                "1"
            "interval"                   "2.0"

            // Spawn chance per class (see guide.md "Recipes" to add more)
            "common%"                    "90"
            "nuke%"                      "10"
            "damizean legacy%"           "0"            // dormant
        }

        "blu"
        {
            "max rockets"                "1"
            "interval"                   "2.0"

            "common%"                    "90"
            "nuke%"                      "10"
            "damizean legacy%"           "0"
        }
    }
}
