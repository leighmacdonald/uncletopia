// TF2 Dodgeball - Guardian Configuration
//
// One player per round becomes the Guardian (1 vs all on BLU).
// Guardian classes define different types with unique stats.
// Add new classes by creating sections under "guardian_classes".
//
// Guardian mode is blocked when bots or FFA are active.

"TF2_Dodgeball"
{
	"guardian"
	{
		"enabled"              "1"
		"selection chance"     "25"       // % chance per round
		"opt out min players"    "0"        // Minimum players required before opt-out is honored

		// HUD (Guardian-only cooldown display)
		"hud x"                "-1.0"
		"hud y"                "0.92"
		"hud color"            "255 50 50"
	}

	// ============================================================================
	// Modular Abilities Documentation
	// ============================================================================
	//
	// You can assign any ability to 'ability_1' and 'ability_2' in a class.
	//
	// Valid Buttons:
	// - "TAUNT"   (G Key / Taunt Menu)
	// - "RELOAD"  (R Key / Reload)
	// - "ATTACK3" (Middle Mouse Button)
	// - "USE"     (H Key / Action Item)
	// 
	// Valid Ability Types:
	// - "rage"   : arg1 = Airblast Refire Time (0.5). arg2 = Airblast Push Force (1.5).
	// - "sprint" : arg1 = Speed Multiplier (1.6).
	// - "charge" : arg1 = Speed Multiplier (3.0+). (Functions like sprint, but higher).
	// - "pounce" : arg1 = Forward Force (1000.0). arg2 = Upward Force (500.0).
	// - "slow"   : arg1 = Radius (500.0). arg2 = Slow Intensity (50.0 = 50% speed). 'duration' controls length.
	// ============================================================================

	"guardian_classes"
	{
		"berserker"
		{
			"name"                       "Berserker"
			"health"                     "5000"
			"weight"                     "100"

			"ability_1"
			{
				"type" "pounce"
				"button" "ATTACK3" // Middle Mouse
				"cooldown" "10.0"
				"duration" "5.0"
				"arg1" "1200.0" // Forward force
				"arg2" "600.0" // Upward force
				"particle" "utaunt_multicurse_teamcolor_blue"
			}

			"ability_2"
			{
				"type"			"slow"			// Stun/Slow nearby players
				"duration"		"10.0"			// Effect duration
				"arg1"			"500.0"			// Radius
				"arg2"			"50.0"			// Slow intensity (50.0 = 50% walk speed)
				"button"		"RELOAD"		// R key
				"cooldown"		"15.0"			
				"particle"		"utaunt_hands_teamcolor_blue"
			}
		}

		// Example: tankier, slower guardian using the current modular ability system.
		// Uncomment to add. See the ability-type notes at the top of this file for
		// which args each type accepts.
		// "juggernaut"
		// {
		//     "name"     "Juggernaut"
		//     "health"   "8000"
		//     "weight"   "50"
		//
		//     "ability_1"
		//     {
		//         "type"     "rage"         // Faster airblast + harder pushback
		//         "button"   "ATTACK3"      // Middle Mouse
		//         "cooldown" "20.0"
		//         "duration" "8.0"
		//         "arg1"     "0.7"          // Airblast refire time multiplier (1.0 = default)
		//         "arg2"     "2.0"          // Airblast push scale (1.0 = default)
		//         "particle" "utaunt_firework_teamcolor_red"
		//     }
		//
		//     "ability_2"
		//     {
		//         "type"     "sprint"       // Short burst of extra move speed
		//         "button"   "RELOAD"       // R key
		//         "cooldown" "18.0"
		//         "duration" "2.0"
		//         "arg1"     "1.3"          // Speed multiplier (1.0 = default TF2 class speed)
		//         "particle" "utaunt_bubbles_glow_green"
		//     }
		// }
	}
}
