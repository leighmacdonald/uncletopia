// ============================================================================
// Player vs Bot (PvB) AI v4.0 Configuration
// Place in: addons/sourcemod/configs/dodgeball/pvb.cfg
//
// [LEARNABLE] = Starting point. Brain drifts from these as it plays.
// [HARD RULE] = Personality identity. Never changes through learning.
//
// ----------------------------------------------------------------------------
// CUSTOM CLASSES
// ----------------------------------------------------------------------------
// You may add ANY number of classes to the "classes" block (up to 32). The
// plugin discovers them at load time. Each class gets its own learning brain
// and persists independently in the SQLite store.
//
// Minimal custom class example:
//
//     "ninja"
//     {
//         "display_name"      "Shadow Ninja"      // shown in menus
//         "bot_name"          "T-Ninja"           // scoreboard name
//         "statue_like"       "0"                 // 1 = never moves
//
//         "react_min"         "0.10"
//         "react_max"         "0.20"
//         "orbit_chance"      "50"
//         "orbit_time"        "1.8"
//         "orbit_max_loops"   "5"
//         "angle_random_chance"   "45"
//         "angle_random_strength" "28.0"
//         "evade_chance"      "60"
//
//         "cqc_floor_dist"    "220"
//         "cqc_min_dist"      "260"
//         "cqc_max_dist"      "450"
//         "cqc_retreat_dist"  "220"
//         "idle_chance"       "10"
//         "idle_duration"     "1.0"
//         "look_at_player_time" "1.2"
//         "speech"            "1"
//     }
//
// Classes whose lowercase key contains "statue" are auto-flagged statue_like.
// Use "statue_like" "1" to force-flag any other class as stationary.
//
// ----------------------------------------------------------------------------
// CAPABILITY-BY-PRESENCE (per-class behavior gates)
// ----------------------------------------------------------------------------
// The bot is physically incapable of behaviors whose keys are ABSENT. Not
// "chance 0" — gated out of the code path entirely. Remove the keys and the
// bot loses the ability.
//
//   REMOVE orbit_time / orbit_max_loops / orbit_chance  -> bot never orbits
//   REMOVE evade_chance                                  -> bot never jumps/crouches to evade
//   REMOVE cqc_floor_dist / cqc_min_dist /
//          cqc_max_dist / cqc_retreat_dist               -> bot has no distance awareness
//                                                          (walks/idles freely regardless of range)
//   REMOVE idle_chance                                   -> bot never stands still and never
//                                                          looks idly around
//
//   SET idle_chance "100"                                -> bot stands still forever.
//                                                          Equivalent behavior to statue_like "1"
//                                                          but keyed off idle_chance so you can
//                                                          convert any class without renaming.
//                                                          idle_duration is ignored in this mode.
//
// Example: an aggressive class that always chases and can never stand still:
//
//     "berserker"
//     {
//         "react_min"             "0.10"
//         "react_max"             "0.20"
//         "orbit_chance"          "35"
//         "orbit_time"            "2.0"
//         "orbit_max_loops"       "3"
//         "evade_chance"          "55"
//         "cqc_floor_dist"        "250"
//         "cqc_min_dist"          "300"
//         "cqc_max_dist"          "500"
//         "cqc_retreat_dist"      "250"
//         // NO idle_chance -> bot never parks, never picks MOVE_IDLE
//     }
//
// Example: a slow statue-like class driven off idle_chance instead of statue_like:
//
//     "meditator"
//     {
//         "react_min"             "0.08"
//         "react_max"             "0.18"
//         "idle_chance"           "100"    // permanent idle
//     }
//
// ============================================================================

"PvB"
{
    "settings"
    {
        "enabled"           "1"
        "bot_name_universal"    "Mann Co. Bot"
        "bot_name_statue"       "TBotV64"
        "bot_name_midrange"     "Mann Co. Bot Tactician"
        "bot_name_aggressive"   "Mann Co. Bot Berserker"
        "bot_type"          "0"
        "min_players"       "1"
        "max_players"       "2"
        "vote_max_players"  "12"

        // ------------------------------------------------------------------
        // Adaptive learning toggles (all default ON)
        // ------------------------------------------------------------------
        // learn_reaction_time: Allows react_min/max to drift per class based
        //   on success/failure. Persisted in bot_reaction_v1. Clamped so the
        //   window can drift at most 90 ms faster or 100 ms slower than the
        //   value set in the class config. Floor of 30 ms (physical limit).
        "learn_reaction_time"   "1"

        // remember_opponents: Persists OpponentProfile keyed by SteamID so
        //   the bot remembers how regulars play across map changes and
        //   server restarts. Stored in bot_opponent_v1.
        "remember_opponents"    "1"

        // use_heatmap: Tracks per-map, per-class cells where players deflect
        //   successfully vs. where they die. The bot biases its trick-choice
        //   weighting toward breaking patterns in low-danger cells where the
        //   player is comfortable. Stored in bot_heatmap_v1. Has no effect
        //   on statue_like classes (they never reposition).
        "use_heatmap"           "1"

        // max_training_bots: Safety cap on !trainingmode bot spawning.
        //   Training spawns min(num_classes, max_training_bots/2) per team.
        //   Keep this <= server maxplayers - 2 to leave room for humans.
        //   Range: 2-30. Default: 16.
        "max_training_bots"     "16"
    }
    
    "speech"
    {
        "universal_playerdeath"     "configs/dodgeball/speech/speech_universal_kill.txt"
        "universal_botdeath"        "configs/dodgeball/speech/speech_universal_death.txt"
        "statue_playerdeath"        "configs/dodgeball/speech/speech_statue_kill.txt"
        "statue_botdeath"           "configs/dodgeball/speech/speech_statue_death.txt"
        "midrange_playerdeath"      "configs/dodgeball/speech/speech_midrange_kill.txt"
        "midrange_botdeath"         "configs/dodgeball/speech/speech_midrange_death.txt"
        "aggressive_playerdeath"    "configs/dodgeball/speech/speech_aggressive_kill.txt"
        "aggressive_botdeath"       "configs/dodgeball/speech/speech_aggressive_death.txt"
    }
    
    "classes"
    {
        "universal"
        {
            // [LEARNABLE] Brain improves from these starting points
            "react_min"             "0.12"
            "react_max"             "0.28"
            "orbit_chance"          "25"
            "orbit_time"            "2.0"
            "orbit_max_loops"       "3"
            "angle_random_chance"   "30"
            "angle_random_strength" "20.0"
            "evade_chance"          "40"
            
            // [HARD RULE] Personality identity
            "cqc_floor_dist"        "250"       // NEVER closer than this (anti-face-hug)
            "cqc_min_dist"          "300"
            "cqc_max_dist"          "600"
            "cqc_retreat_dist"      "250"
            "idle_chance"           "40"
            "idle_duration"         "3.0"
            "look_at_player_time"   "1.5"
            "speech"                "1"
        }
        
        "statue"
        {
            // [LEARNABLE]
            "react_min"             "0.08"
            "react_max"             "0.18"
            "angle_random_chance"   "15"
            "angle_random_strength" "10.0"
            // evade / orbit / cqc keys deliberately ABSENT — statue is gated
            // off movement entirely by ClassIsStatueLike (set via "statue"
            // substring in class key), so these behaviors never fire anyway.
            // Removing the keys makes that explicit to the capability system.

            // [HARD RULE] Statue: stands still always
            "idle_chance"           "100"       // permanent idle; idle_duration ignored
            "look_at_player_time"   "0.5"
            "speech"                "1"
        }
        
        "midrange"
        {
            // [LEARNABLE]
            "react_min"             "0.10"
            "react_max"             "0.24"
            "orbit_chance"          "30"
            "orbit_time"            "2.5"
            "orbit_max_loops"       "4"
            "angle_random_chance"   "35"
            "angle_random_strength" "25.0"
            "evade_chance"          "50"
            
            // [HARD RULE] Midrange: keeps distance
            "cqc_floor_dist"        "300"       // Higher floor than others
            "cqc_min_dist"          "400"
            "cqc_max_dist"          "700"
            "cqc_retreat_dist"      "350"
            "idle_chance"           "30"
            "idle_duration"         "2.5"
            "look_at_player_time"   "1.5"
            "speech"                "1"
        }
        
        "aggressive"
        {
            // [LEARNABLE]
            "react_min"             "0.10"
            "react_max"             "0.22"
            "orbit_chance"          "35"
            "orbit_time"            "2.0"
            "orbit_max_loops"       "3"
            "angle_random_chance"   "40"
            "angle_random_strength" "30.0"
            "evade_chance"          "55"
            
            // [HARD RULE] Aggressive: closer but respects floor
            "cqc_floor_dist"        "250"
            "cqc_min_dist"          "300"
            "cqc_max_dist"          "500"
            "cqc_retreat_dist"      "250"
            "idle_chance"           "15"
            "idle_duration"         "1.5"
            "look_at_player_time"   "2.0"
            "speech"                "1"
        }
    }
}
