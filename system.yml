---
- name: System Setup
  hosts: all
  become: true
  tasks:
    - name: Set a hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Check if i386 is enabled
      ansible.builtin.shell: dpkg --print-foreign-architectures | grep i386 # noqa risky-shell-pipe
      register: result_i386_check
      changed_when: result_i386_check.rc == 1
      failed_when: result_i386_check.rc > 1
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']

    # Liquorix is being retired across the fleet: strip the PPA and kernel
    # packages if a host has them and fall back to the distro kernel.
    - name: Remove liquorix PPA repository
      ansible.builtin.deb822_repository:
        name: damentz-liquorix
        state: absent
      register: liquorix_ppa_removed

    - name: Remove legacy liquorix PPA .list file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/zen-repo.list
        state: absent

    - name: Update apt cache after removing liquorix PPA
      ansible.builtin.apt:
        update_cache: true
      when: liquorix_ppa_removed is changed # noqa no-handler

    - name: Install stock kernel
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        pkg: "{{ ['linux-generic'] if ansible_facts['distribution'] == 'Ubuntu' else ['linux-image-amd64'] }}"

    - name: Remove liquorix kernel packages
      # purging the metas + autoremove takes the versioned liquorix kernels
      # with them; grub falls back to the newest remaining (stock) kernel on
      # the next reboot
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
      ansible.builtin.apt:
        pkg:
          - linux-image-liquorix-amd64
          - linux-headers-liquorix-amd64
        state: absent
        purge: true
        autoremove: true

    - name: Configure cpufrequtils
      become: true
      ansible.builtin.copy:
        dest: "/etc/default/cpufrequtils"
        mode: "0755"
        content: |
          GOVERNOR="performance"

    - name: Download docker gpg key
      become: true
      become_user: root
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add docker apt repository
      become: true
      become_user: root
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris: https://download.docker.com/linux/ubuntu
        suites: focal
        components:
          - stable
        architectures:
          - amd64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Remove legacy docker repository .list file
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        state: absent

    - name: Enable i386 architecture # noqa no-changed-when
      ansible.builtin.command: dpkg --add-architecture i386
      when: result_i386_check.rc == 1

    - name: Install gpg & dd dependencies
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        state: present
        pkg:
          - unzip
          - gpg
          - cpufrequtils
          - python3-netaddr
          - wget
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - python3-docker
          - libc6:i386
          - lib32stdc++6
          - docker-buildx-plugin
          - rsync
          - cron

    - name: Install unattended-upgrades
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        state: present
        name: unattended-upgrades

    # Installs security (and docker) updates daily; the upgrade itself runs on
    # the distro default timer (~06:00 local + randomized delay), the reboot is
    - name: Enable daily unattended-upgrades
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Configure unattended-upgrades (auto reboot at 07:00 localtime)
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99uncletopia-unattended-upgrades
        mode: "0644"
        content: |
          // Managed by Ansible (system.yml) - do not edit on this host.

          // Reboot automatically when an upgrade (e.g. a kernel) requires it.
          // The time is interpreted in the host's local timezone, which is set
          // from the `timezone` variable at the top of this play.
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "07:00";

          // These are headless game servers; don't let a stray SSH session block
          // a pending security reboot.
          Unattended-Upgrade::Automatic-Reboot-WithUsers "true";

          // Keep /boot from filling up with old kernels.
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";

          Unattended-Upgrade::SyslogEnable "true";

          // Ubuntu's default origin list only covers *-security. The container
          // runtime comes from the Docker repo, so allow it to upgrade
          // unattended as well.
          Unattended-Upgrade::Origins-Pattern {
                  "origin=Docker";
          };

    - name: Enable unattended-upgrades timers
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    - name: Create rcon directory if it does not exist
      ansible.builtin.file:
        path: ~/rcon
        state: directory
        mode: "0755"

    - name: Reload systemd daemon
      become: true
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Add docker group to user
      become: true
      ansible.builtin.user:
        name: tf2server
        groups: docker
        append: true

    - name: Disable irqbalance # noqa: ignore-errors
      become: true
      ignore_errors: true
      ansible.builtin.systemd:
        name: irqbalance
        state: stopped
        masked: true
        enabled: false

    # ondemand service will force ondemand
    - name: Disable ondemand # noqa ignore-errors
      become: true
      ignore_errors: true
      ansible.builtin.systemd:
        name: ondemand
        state: stopped
        masked: true
        enabled: false

    - name: Enable docker service
      become: true
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create node_exporter container
      community.docker.docker_container:
        name: node_exporter
        image: prom/node-exporter:v1.7.0
        restart_policy: unless-stopped
        restart: true
        pull: true
        volumes:
          - "/:/host:ro,rslave"
        command:
          - "--path.rootfs=/host"
        ports:
          - "{{ vpn_ip[inventory_hostname] }}:9100:9100"
      tags:
        - metrics-client
        - node_exporter
