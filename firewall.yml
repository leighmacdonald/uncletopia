---
- name: Firewall Setup
  hosts: all
  become: true
  tasks:
    - block:
        - name: Install UFW
          ansible.builtin.apt:
            name: ufw
            state: present

        - name: Reset UFW
          community.general.ufw:
            state: reset

        - name: Allow outgoing traffic
          community.general.ufw:
            default: allow
            direction: outgoing

        - name: Deny incoming
          community.general.ufw:
            default: deny
            direction: incoming

        - name: Allow Game Port
          community.general.ufw:
            rule: allow
            port: "{{ srcds_base_port + (loop0 * 10) }}"
            proto: udp
            comment: srcds-game
            from_ip: 0.0.0.0/0
          loop: "{{ services }}"
          loop_control:
            index_var: loop0
          when: ansible_distribution == 'Ubuntu'

        - name: Allow RCON Port
          community.general.ufw:
            rule: allow
            port: "{{ srcds_base_port + (loop0 * 10) }}"
            proto: tcp
            comment: srcds-rcon
            src: "{{ vpn_mask }}"
          loop: "{{ services }}"
          loop_control:
            index_var: loop0
          when: ansible_distribution == 'Ubuntu'

        - name: Allow SourceTV
          community.general.ufw:
            rule: allow
            port: "{{ srcds_base_port + (loop0 * 10) + 1 }}"
            proto: udp
            comment: srcds-stv
            from_ip: 0.0.0.0/0
          loop: "{{ services }}"
          loop_control:
            index_var: loop0
          when: ansible_distribution == 'Ubuntu'

      always:
        - name: Grant ssh access
          ufw:
            rule: allow
            direction: in
            port: "22"
            proto: tcp
            from_ip: "{{ item }}"
          loop: "{{ ssh_allowed_hosts }}"

        - name: Enable Firewall
          ufw:
            state: enabled
